services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn eldproject.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL after the first deploy
      - key: GEOCODER_USER_AGENT
        sync: false          # Nominatim asks for a contact address
      - key: DATABASE_URL
        fromDatabase:
          name: eld-db
          property: connectionString

databases:
  - name: eld-db
    plan: free
    databaseName: eld
