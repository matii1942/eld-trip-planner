services:
  - type: web
    name: eld-trip-planner-api
    runtime: python
    rootDir: backend
    plan: free

    # "bash build.sh" rather than "./build.sh": the executable bit does not
    # survive a zip round-trip through Windows, and Render would fail the
    # build with "permission denied".
    buildCommand: "bash build.sh"

    # migrate runs at start, not build, so the SQLite file exists in the
    # container that actually serves traffic.
    startCommand: >-
      python manage.py migrate --no-input &&
      gunicorn eldproject.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60

    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL after the frontend deploys
      - key: GEOCODER_USER_AGENT
        sync: false          # put a real contact address or repo URL here

# No database block on purpose.
#
# Render's free PostgreSQL expires after 30 days, which would break the live
# demo a month from now. A trip plan is deterministic -- the same inputs always
# regenerate the same result -- so persistence is only a convenience for
# shareable ?trip=<id> links, not something the app depends on. SQLite on the
# container's own disk covers that and never expires; the trade is that old
# links stop resolving after a restart.
#
# Moving to Postgres is a one-variable change: add the database and set
# DATABASE_URL. psycopg2-binary is already in requirements.txt for that reason.
